name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-contracts:
    name: Test Soroban Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.84.1
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/bounty_box/target
            contracts/escrow_contract/target
            contracts/registry/target
          key: ${{ runner.os }}-cargo-1.84.1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.84.1-

      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli --features opt || true

      - name: Run Cargo Test
        run: |
          cargo test --manifest-path contracts/escrow_contract/Cargo.toml --verbose
          cargo test --manifest-path contracts/bounty_box/Cargo.toml --verbose
          cargo test --manifest-path contracts/registry/Cargo.toml --verbose

  build-frontend:
    name: Build Frontend dApp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Verify Frontend Production Build
        run: |
          cd frontend
          npm run build
