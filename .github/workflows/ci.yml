name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-contracts:
    name: Test Soroban Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Run Cargo Test
        env:
          RUSTFLAGS: "-A unexpected_cfgs --cap-lints allow"
        run: |
          cargo test --manifest-path contracts/escrow_contract/Cargo.toml
          cargo test --manifest-path contracts/bounty_box/Cargo.toml
          cargo test --manifest-path contracts/registry/Cargo.toml

  build-frontend:
    name: Build Frontend dApp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Verify Frontend Production Build
        run: |
          cd frontend
          npm run build
